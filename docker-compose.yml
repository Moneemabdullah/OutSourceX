services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: outsourcex-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - outsourcex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer for database management (optional)
  adminer:
    image: adminer:latest
    container_name: outsourcex-adminer-dev
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - outsourcex-network

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: outsourcex-backend-dev
    command: npm run dev
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${PRISMA_STUDIO_PORT:-51212}:51212"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - outsourcex-network

volumes:
  postgres_data:
    driver: local
  backend_node_modules:
    driver: local

networks:
  outsourcex-network:
    driver: bridge
